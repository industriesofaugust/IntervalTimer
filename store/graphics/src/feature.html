<!doctype html>
<!-- The Play Store feature graphic, 1024x500. The icon's ring beside the wordmark, in the app's own fonts. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Space Grotesk";src:url("../../../core/src/main/res/font/space_grotesk.ttf");font-weight:300 700}
@font-face{font-family:"JetBrains Mono";src:url("../../../core/src/main/res/font/jetbrains_mono.ttf");font-weight:100 800}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#221F1B}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:64px}
h1{margin:0;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:132px;line-height:.95;
  letter-spacing:-2px;color:#F3EEE6}
.timer{margin-top:16px;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;
  letter-spacing:9px;color:#E87F63}
.strip{display:flex;gap:5px;margin-top:38px;width:470px}
.strip i{display:block;height:8px;border-radius:2px}
.w{background:#E87F63;flex:2}.r{background:#52B3A5;flex:1}
.tag{margin-top:26px;font-family:"JetBrains Mono",monospace;font-weight:400;font-size:21px;
  letter-spacing:2.5px;color:#A79F92}
</style></head><body>
<div class="wrap">
  <svg xmlns="http://www.w3.org/2000/svg" width="330" height="330" viewBox="22 22 64 64" fill="none">
    <path d="M55.67,30.06 A24,24 0 0,1 77.87,51.49" stroke="#E87F63" stroke-width="8"/>
    <path d="M77.99,54.84 A24,24 0 0,1 75.57,64.52" stroke="#52B3A5" stroke-width="8"/>
    <path d="M73.9,67.42 A24,24 0 0,1 44.24,75.93" stroke="#E87F63" stroke-width="8"/>
    <path d="M41.28,74.35 A24,24 0 0,1 34.1,67.42" stroke="#52B3A5" stroke-width="8"/>
    <path d="M32.43,64.52 A24,24 0 0,1 39.89,34.58" stroke="#5A544B" stroke-width="8"/>
    <path d="M42.73,32.81 A24,24 0 0,1 52.33,30.06" stroke="#3A362F" stroke-width="8"/>
    <path d="M54,54 L42.74,60.5" stroke="#F3EEE6" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="54" cy="54" r="3.5" fill="#F3EEE6"/>
  </svg>
  <div>
    <h1>DIALED</h1>
    <div class="timer">INTERVAL TIMER</div>
    <div class="strip"><i class="w"></i><i class="r"></i><i class="w"></i><i class="r"></i><i class="w"></i><i class="r"></i><i class="w"></i><i class="r"></i><i class="w"></i></div>
    <div class="tag">HIIT · TABATA · CIRCUITS</div>
  </div>
</div>
</body></html>
