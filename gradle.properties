org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The app's version, shared by the phone and watch apps.
# For every upload to Google Play: raise appVersionNumber by 1, and change
# appVersionName when the release is one users should notice (1.0.1, 1.1.0).
# Play needs a different code for each file, so the phone build gets
# appVersionNumber x 10 and the watch build that plus 1 (18 -> 180 and 181).
appVersionName=1.0.0
appVersionNumber=18
